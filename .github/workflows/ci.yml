name: Wonder Atlas tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run full automated integration suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Check first-party JavaScript syntax
        run: |
          set -e
          for file in static/*.js; do
            node --check "$file"
          done
